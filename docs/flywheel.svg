<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b6b7b"/>
    </marker>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef6ff"/><stop offset="1" stop-color="#dcecff"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4e6"/><stop offset="1" stop-color="#ffe8cc"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6fcf5"/><stop offset="1" stop-color="#c3fae8"/>
    </linearGradient>
  </defs>

  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a2b3c">Correction Memory Flywheel</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#5b6b7b">More corrections &#8594; better prompts &#8594; fewer escalations &#8594; lower cost</text>

  <rect x="60" y="90" width="230" height="120" rx="10" fill="url(#g3)" stroke="#20a97b" stroke-width="1.5"/>
  <text x="175" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#0b6b4f">Tier 1 &#183; Graduated Rules</text>
  <text x="175" y="142" text-anchor="middle" font-size="12" fill="#2f5a4c">Deterministic patterns</text>
  <text x="175" y="160" text-anchor="middle" font-size="12" fill="#2f5a4c">from repeated corrections</text>
  <text x="175" y="188" text-anchor="middle" font-size="12" font-weight="700" fill="#0b6b4f">$0 &#183; &lt;1ms &#183; no LLM</text>

  <rect x="335" y="90" width="230" height="120" rx="10" fill="url(#g1)" stroke="#3b82c4" stroke-width="1.5"/>
  <text x="450" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#1c5a8f">Tier 2 &#183; Cloud LLM</text>
  <text x="450" y="142" text-anchor="middle" font-size="12" fill="#2e4d66">Bedrock extraction with</text>
  <text x="450" y="160" text-anchor="middle" font-size="12" fill="#2e4d66">confidence gating</text>
  <text x="450" y="188" text-anchor="middle" font-size="12" font-weight="700" fill="#1c5a8f">low cost &#183; ~1s</text>

  <rect x="610" y="90" width="230" height="120" rx="10" fill="url(#g2)" stroke="#e8863c" stroke-width="1.5"/>
  <text x="725" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#a85d16">Tier 3 &#183; Self-Healing</text>
  <text x="725" y="142" text-anchor="middle" font-size="12" fill="#7a4f1f">Retry with past corrections</text>
  <text x="725" y="160" text-anchor="middle" font-size="12" fill="#7a4f1f">as few-shot examples</text>
  <text x="725" y="188" text-anchor="middle" font-size="12" font-weight="700" fill="#a85d16">higher cost &#183; ~3s</text>

  <line x1="290" y1="135" x2="333" y2="135" stroke="#5b6b7b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="312" y="126" text-anchor="middle" font-size="10" fill="#5b6b7b">miss</text>
  <line x1="565" y1="135" x2="608" y2="135" stroke="#5b6b7b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="587" y="126" text-anchor="middle" font-size="10" fill="#5b6b7b">low conf</text>

  <rect x="335" y="300" width="230" height="86" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="1.5"/>
  <text x="450" y="330" text-anchor="middle" font-size="14" font-weight="700" fill="#343a40">Correction Log (DynamoDB)</text>
  <text x="450" y="352" text-anchor="middle" font-size="11" fill="#495057">what went wrong, and why</text>
  <text x="450" y="370" text-anchor="middle" font-size="11" fill="#495057">grows from QA feedback</text>

  <path d="M725,210 L725,343 L568,343" fill="none" stroke="#e8863c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="648" y="332" text-anchor="middle" font-size="10" fill="#a85d16">corrections</text>

  <path d="M332,343 L175,343 L175,212" fill="none" stroke="#20a97b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="250" y="332" text-anchor="middle" font-size="10" fill="#0b6b4f">rules graduate</text>

  <path d="M450,300 L450,212" fill="none" stroke="#3b82c4" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="516" y="258" text-anchor="middle" font-size="10" fill="#1c5a8f">few-shot examples</text>

  <text x="450" y="430" text-anchor="middle" font-size="12" fill="#5b6b7b">Over time, more traffic is served by Tier 1 (free) &#8212; accuracy rises and cost falls.</text>
</svg>
